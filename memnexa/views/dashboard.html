<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memnexa</title><link rel="stylesheet" href="../client/css/app.css"></head><body>
<header><span class="logo">Memnexa</span><span class="sp"></span>
<input id="q" placeholder="Search memories, #tags…">
<button class="btn ghost" id="bell" title="Enable deadline reminders">🔔</button>
<button class="btn ghost" id="theme" title="Dark mode">🌓</button>
<a class="btn ghost" href="/api/export.csv" title="Export CSV">⬇ CSV</a>
<span id="av" class="av"></span><button class="btn ghost" id="out">Sign out</button></header>
<main>
<div class="stats">
<div class="card stat"><b id="sStreak">0</b><span>🔥 day streak</span></div>
<div class="card stat"><b id="sDone">0</b><span>Completed</span></div>
<div class="card stat"><b id="sOver" style="color:var(--red)">0</b><span>Overdue</span></div>
<div class="card stat"><b id="sMiss">0</b><span>Missed (history)</span></div></div>

<div class="row2">
<div class="card"><h3 style="margin-top:0">Add memory</h3>
<div class="seg"><button data-t="task" class="on">Task</button><button data-t="life">Life memory</button></div>
<textarea id="title" rows="2" placeholder="What do you want to remember?"></textarea>
<div class="grid">
<input type="date" id="due" title="Deadline / date it happened">
<select id="pri"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select>
<select id="rec"><option value="">No repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select>
<input id="tags" placeholder="tags, comma"></div>
<div style="display:flex;gap:8px"><button class="btn" id="add">Add</button><button class="btn ghost" id="mic">🎤 Voice</button></div>
<div class="drop" id="drop">📎 Drop a screenshot or PDF here, or click to choose<input type="file" id="file" accept="image/*,.pdf" hidden></div></div>

<div class="card"><h3 style="margin-top:0">Ask Memnexa</h3>
<div style="display:flex;gap:8px"><input id="ask" placeholder="e.g. What's due this week? When did I visit Goa?"><button class="btn" id="askBtn">Ask</button></div>
<div class="ans" id="ans" style="display:none"></div>
<h4 style="margin:18px 0 6px">🕰 On this day</h4><div id="otd" class="empty" style="padding:6px;text-align:left"></div></div></div>

<div class="card"><h3 style="margin-top:0">Timeline</h3><div class="chart" id="chart"></div></div>

<div class="card"><div class="tabs" id="tabs">
<button data-v="today" class="on">Today &amp; overdue</button><button data-v="tasks">All tasks</button><button data-v="life">Life memories</button><button data-v="history">History</button></div>
<div id="list"></div></div>
</main>

<div class="modal" id="modal"><div class="card"><h3 style="margin-top:0">Review extracted memories</h3>
<div id="props"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="saveP">Save selected</button><button class="btn ghost" id="cancelP">Cancel</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="../client/js/dashboard.js?v=5"></script></body></html>
